name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-pro-guided-setup:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/pro-guided-connection-setup'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/pro-guided-connection-setup
          fetch-depth: 0

      - name: Apply guided Pro setup changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent/complete_pro_guided_setup.py')
          source = path.read_text(encoding='utf-8')
          old = '    style = replace_once(style, style_marker, style_additions + style_marker, "insert guided detail styles")'
          new = '''    marker_index = style.find(style_marker)
              if marker_index < 0:
                  raise SystemExit("insert guided detail styles: marker not found")
              style = style[:marker_index] + style_additions + style[marker_index:]'''
          if source.count(old) != 1:
              raise SystemExit('CSS insertion correction did not match exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/agent/complete_pro_guided_setup.py

      - name: Validate focused implementation
        run: |
          node --check assets/field_visibility.js
          node --check assets/pro_guided_workflow.js
          node --check assets/devhub_upload.js
          python -m pip install -e . pytest
          python -m pytest -q tests/test_pro_guided_workflow.py tests/test_basic_guided_interface.py
          git diff --check

      - name: Commit implementation and restore repository workflows
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/agent-complete-pro-guided-setup.yml
          rm -f .github/agent/complete_pro_guided_setup.py
          git add assets/field_visibility.js assets/pro_guided_workflow.js assets/pro_guided_workflow.css tests/test_pro_guided_workflow.py .github/workflows/ci.yml .github/workflows/agent-complete-pro-guided-setup.yml .github/agent/complete_pro_guided_setup.py
          git config user.name "VRhotspot Agent"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Complete guided five-step Pro connection setup"
          git push origin HEAD:agent/pro-guided-connection-setup

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install shellcheck
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff pytest

      - name: Compile
        run: python -m compileall -q backend/vr_hotspotd

      - name: Ruff
        run: ruff check .

      - name: Validate vendor manifest and generate deterministic vendor-only SBOM
        run: python tools/ci/vendor_manifest_check.py --sbom-output /tmp/vrhotspot-vendor-sbom.json

      - name: Validate Dev Bridge Platform-Tools pin metadata
        run: python tools/ci/platform_tools_pin_check.py

      - name: Pytest
        run: pytest -q

      - name: Shellcheck
        run: shellcheck backend/scripts/*.sh

  install-matrix-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OS detection matrix
        run: tools/ci/install_matrix_check.sh
